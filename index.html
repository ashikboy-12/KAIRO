<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07090f">
  <title>KAIRO AI</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="app">

  <header class="top-bar">
    <div class="brand">
      <div class="brand-logo">K</div>
      <div class="brand-text">
        <div class="brand-name">KAIRO</div>
        <div class="brand-status">AI COMPANION</div>
      </div>
    </div>

    <div class="top-actions">
      <button id="newChatButton" class="top-button"
        type="button" aria-label="New Chat">+</button>

      <button id="memoryButton" class="top-button"
        type="button" aria-label="Memory">🧠</button>

      <button id="historyButton" class="history-button"
        type="button" aria-label="History">◷</button>
    </div>
  </header>

  <main id="chat" class="chat">
    <div class="welcome">
      <div class="welcome-logo">
        <div class="welcome-core"></div>
      </div>
      <h1>Hello, I'm KAIRO</h1>
      <p>Your AI companion for conversation, answers and ideas.</p>
    </div>
  </main>

  <div class="input-area">
    <div class="input-box">

      <textarea
        id="messageInput"
        rows="1"
        placeholder="Talk to KAIRO..."
        autocomplete="off"></textarea>

      <div class="input-actions">
        <button id="micButton" class="input-button"
          type="button" aria-label="Voice input">🎙</button>

        <button id="sendButton" class="send-button"
          type="button" aria-label="Send message">➤</button>
      </div>

    </div>
  </div>

  <section id="voiceMode" class="voice-mode" aria-hidden="true">
    <div class="voice-mode-background"></div>

    <div class="voice-content">
      <div id="voiceLogo" class="voice-logo" aria-label="KAIRO AI Core">
        <div class="voice-energy energy-one"></div>
        <div class="voice-energy energy-two"></div>
        <div class="voice-energy energy-three"></div>

        <div class="voice-logo-ring ring-one"></div>
        <div class="voice-logo-ring ring-two"></div>

        <div class="voice-logo-core">
          <div class="core-light"></div>
          <div class="core-inner"></div>
        </div>
      </div>

      <div id="voiceStatus" class="voice-status">Ready</div>
      <div id="voiceSubtitle" class="voice-subtitle">Talk to KAIRO</div>

      <button id="closeVoiceButton" class="voice-close-button"
        type="button" aria-label="Close Voice Mode">×</button>
    </div>
  </section>

  <button id="miniVoiceButton" class="mini-voice-button"
    type="button" aria-label="Open KAIRO Voice Mode">K</button>

  <button id="floatingKairo" class="floating-kairo"
    type="button" aria-label="Open KAIRO Voice Mode">K</button>

  <div id="historyBackdrop" class="history-backdrop" aria-hidden="true"></div>

  <aside id="historyPanel" class="history-panel" aria-hidden="true">
    <div class="history-header">
      <div>
        <div class="history-title">History</div>
        <div class="history-subtitle">Your conversations</div>
      </div>

      <button id="closeHistoryButton" class="panel-close-button"
        type="button" aria-label="Close History">×</button>
    </div>

    <div class="history-tools">
      <input id="historySearch" type="search"
        placeholder="Search conversations..." autocomplete="off">
    </div>

    <div id="historyList" class="history-list"></div>
  </aside>

  <div id="memoryBackdrop" class="memory-backdrop" aria-hidden="true"></div>

  <aside id="memoryPanel" class="memory-panel" aria-hidden="true">
    <div class="memory-header">
      <div>
        <div class="memory-title">KAIRO Memory</div>
        <div class="memory-subtitle">Important things KAIRO remembers</div>
      </div>

      <button id="closeMemoryButton" class="panel-close-button"
        type="button" aria-label="Close Memory">×</button>
    </div>

    <div id="memoryList" class="memory-list"></div>

    <button id="clearMemoryButton" class="clear-memory-button"
      type="button">Clear All Memory</button>
  </aside>

</div>

<script src="app.js"></script>
</body>
</html>
